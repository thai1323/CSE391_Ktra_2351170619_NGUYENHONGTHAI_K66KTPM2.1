<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List App - Full UI</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container my-5" style="max-width: 720px;">
    
    <div class="task-board p-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0" style="color: #1e293b; font-size: 1.75rem;">Task List</h2>
            <button class="btn btn-primary px-3 py-2 fw-semibold rounded-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#addTaskModal" style="background-color: #6366f1; border: none;">
                + Add Task
            </button>
        </div>

        <div id="mainTaskList"></div>
    </div>

</div>

<div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 600px;">
        <div class="modal-content p-3 rounded-4 border-0 shadow">
            
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark" style="font-size: 1.25rem;">Add Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="closeModalBtn"></button>
            </div>
            
            <div class="modal-body">
                <form id="taskForm" onsubmit="saveNewTask(event)">
                    <div class="mb-3">
                        <label for="inputTaskName" class="form-label fw-semibold text-secondary small">Task</label>
                        <input type="text" class="form-control py-2 rounded-3" id="inputTaskName" placeholder="Type your task here..." style="border: 1px solid #e2e8f0;">
                        <div id="errorFeedback" class="invalid-feedback">
                            Tên công việc không được trống và không được quá 100 ký tự!
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small d-block">Priority</label>
                        <div class="d-flex gap-2">
                            <input type="radio" class="btn-check" name="prioRadio" id="radioHigh" value="High" checked>
                            <label class="btn btn-outline-danger-custom btn-sm px-3 py-1 rounded-3 fw-semibold" for="radioHigh">High</label>

                            <input type="radio" class="btn-check" name="prioRadio" id="radioMedium" value="Medium">
                            <label class="btn btn-outline-warning-custom btn-sm px-3 py-1 rounded-3 fw-semibold" for="radioMedium">Medium</label>

                            <input type="radio" class="btn-check" name="prioRadio" id="radioLow" value="Low">
                            <label class="btn btn-outline-success btn-sm px-3 py-1 rounded-3 fw-semibold" for="radioLow">Low</label>
                        </div>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-secondary px-4 py-2 fw-semibold rounded-3" style="background-color: #64748b; border: none;">Add</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="bootstrap.bundle.min.js"></script>

<script>
    let listTasks = [];

    window.onload = async function() {
        const localData = localStorage.getItem('my_tasks_storage');
        if (localData) {
            listTasks = JSON.parse(localData);
            displayTasksToUI();
        } else {
            try {
                let response = await fetch('data.json');
                listTasks = await response.json();
            } catch (error) {
                listTasks = [
                    { "id": 1, "task": "Go to gym", "priority": "High", "status": "To Do" },
                    { "id": 2, "task": "Read a book", "priority": "Low", "status": "Done" },
                    { "id": 3, "task": "Go to market", "priority": "Medium", "status": "In Progress" },
                    { "id": 4, "task": "Learn Web Development", "priority": "High", "status": "In Progress" },
                    { "id": 5, "task": "Do homework", "priority": "Low", "status": "To Do" }
                ];
            }
            updateLocalStorage();
            displayTasksToUI();
        }
    };

    function updateLocalStorage() {
        localStorage.setItem('my_tasks_storage', JSON.stringify(listTasks));
    }

    // Phân tách dữ liệu động để vẽ nhãn và vòng tiến trình tương ứng cho từng hàng
    function displayTasksToUI() {
        const area = document.getElementById('mainTaskList');
        area.innerHTML = ''; 

        if (listTasks.length === 0) {
            area.innerHTML = `<div class="text-center text-muted bg-white p-4 rounded-3">Chưa có công việc nào tồn tại.</div>`;
            return;
        }

        listTasks.forEach(item => {
            // Logic 1: Xác định class cho vòng tròn tiến trình dựa trên trạng thái từ JSON
            let circleClass = "circle-todo";
            if (item.status === "In Progress") {
                circleClass = "circle-progress";
            } else if (item.status === "Done") {
                circleClass = "circle-done";
            }

            // Logic 2: Nếu tạo mới chưa có trường status, mặc định hiển thị là "To Do"
            let currentStatus = item.status ? item.status : "To Do";

            const rowHTML = `
                <div class="task-card-item shadow-sm">
                    <div class="row align-items-center g-0 text-center text-md-start">
                        
                        <div class="col-12 col-md-4 text-start mb-2 mb-md-0">
                            <div class="label-sub">Task</div>
                            <div class="fw-semibold text-dark text-truncate pe-2" style="font-size: 0.95rem;">${item.task}</div>
                        </div>
                        
                        <div class="col-3 col-md-2 text-start">
                            <div class="label-sub">Priority</div>
                            <div class="prio-${item.priority}" style="font-size: 0.95rem;">${item.priority}</div>
                        </div>
                        
                        <div class="col-4 col-md-3 text-center">
                            <div class="status-badge">${currentStatus}</div>
                        </div>
                        
                        <div class="col-2 col-md-1 text-center">
                            <span class="progress-circle ${circleClass}"></span>
                        </div>
                        
                        <div class="col-3 col-md-2 text-end">
                            <button class="btn-action-edit" title="Sửa công việc"></button>
                            <button class="btn-action-delete" title="Xóa công việc" onclick="removeItem(${item.id})"></button>
                        </div>

                    </div>
                </div>
            `;
            area.innerHTML += rowHTML;
        });
    }

    function validateInputData(text) {
        const cleanText = text.trim();
        if (cleanText === "" || cleanText.length > 100) {
            return false;
        }
        return true;
    }

    function saveNewTask(event) {
        event.preventDefault(); 

        const inputField = document.getElementById('inputTaskName');
        const textValue = inputField.value;

        if (validateInputData(textValue) === false) {
            inputField.classList.add('is-invalid');
            return; 
        } else {
            inputField.classList.remove('is-invalid');
        }

        const chosenPrio = document.querySelector('input[name="prioRadio"]:checked').value;

        const currentNewItem = {
            id: Date.now(), 
            task: textValue.trim(),
            priority: chosenPrio,
            status: "To Do" // Công việc mới tạo mặc định gán trạng thái To Do theo kịch bản mẫu
        };

        listTasks.push(currentNewItem);
        updateLocalStorage();
        displayTasksToUI();

        inputField.value = '';
        document.getElementById('closeModalBtn').click();
    }

    function removeItem(targetId) {
        listTasks = listTasks.filter(item => item.id !== targetId);
        updateLocalStorage();
        displayTasksToUI();
    }
</script>
</body>
</html>
